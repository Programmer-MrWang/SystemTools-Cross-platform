name: Build Project

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build CIPX
        run: dotnet publish -p:CreateCipx=true --configuration Release --no-restore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: systemtools-cipx-artifacts
          path: |
            /home/runner/work/SystemTools-Cross-platform/SystemTools-Cross-platform/src/SystemTools.CrossPlatform/cipx/SystemTools.CrossPlatform.cipx
